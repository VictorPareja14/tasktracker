spring:
  application:
    name: tasktracker
  profiles:
    active: dev
  datasource:
    url: 'jdbc:postgresql://${DB_HOST:localhost}:5432/taskdb'
    username: '${DB_USER:admin}'
    password: '${DB_PASSWORD:admin}'
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect